name: mooInk sleep manager checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-ui:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install image decoder needed by the backup-only integrity test
        run: python -m pip install "Pillow>=10,<13"

      - name: Check Python syntax
        run: |
          python -m compileall -q mook_sleep_screen_manager.py mook_sleep_screen_manager_ui.py mooink_full_cmd_demo.py tests

      - name: Backend regression tests (no reader required)
        run: |
          python -m unittest discover -s tests -v

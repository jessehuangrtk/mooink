name: mooInk sleep manager checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-ui:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install image decoder needed by the backup-only integrity test
        run: python -m pip install "Pillow>=10,<13"

      - name: Install WPD dependency and smoke-test bundled transport
        if: matrix.python-version != '3.9'
        run: |
          python -m pip install "comtypes>=1.4.11"
          python -c "from third_party.heribert17_win_access import get_portable_devices; print('Bundled WPD transport imported successfully')"

      - name: Check Python syntax
        run: |
          python -m compileall -q mook_sleep_screen_manager.py mook_sleep_screen_manager_ui.py mooink_full_cmd_demo.py mooink_display_watcher.py mooink_multi_device.py mooink_wifi_pairing.py mooink_wifi_cover.py tests

      - name: Backend regression tests (no reader required)
        run: |
          python -m unittest discover -s tests -v

  standalone-release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete offline release
        shell: cmd
        run: call mooink_display_watcher_release.bat
      - name: Install only from bundled wheels without reader or Pico
        shell: cmd
        working-directory: ../mooink_display_watcher
        run: call install.bat
      - name: Check packaged templates and preserve edited document
        shell: pwsh
        working-directory: ../mooink_display_watcher
        run: |
          $files = @('mooink_display_10.docx','mooink_display_13.docx','mooink_display_10.png','mooink_display_13.png','release_commit.txt','third_party/heribert17_win_access.py','mooink_multi_device.py')
          foreach ($file in $files) { if (!(Test-Path $file)) { throw "Missing release file: $file" } }
          if ((Get-Content release_commit.txt).Trim() -ne $env:GITHUB_SHA) { throw 'Incorrect release revision' }
          Set-Content mooink_display_10.docx 'user edited document'
          $hash = (Get-FileHash mooink_display_10.docx).Hash
          & .\.venv\Scripts\python.exe mooink_display_watcher.py --init-templates
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash mooink_display_10.docx).Hash -ne $hash) { throw 'Template initialization overwrote user document' }
